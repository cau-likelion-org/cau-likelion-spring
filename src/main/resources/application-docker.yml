spring:
  config:
    activate:
      on-profile: docker
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:1h}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:14d}

attendance:
  session-start-hour: 19
  check-close-hour: 22
  late-grace-minutes: 5
  # session-start-hour/late-grace-minutes를 바꾸면 이 cron도 같이 맞춰서 바꿔야 함 (분 시 * * 요일)
  absence-check-cron: "0 5 19 * * WED"
